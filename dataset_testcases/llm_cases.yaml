# Cases for the offline LLM example suite — banking/payment domain.
# Expected outputs must match apps.demo_app:answer canned replies.
cases:
  - id: balance-inquiry
    input: "what is my checking balance"
    expected_output: "your checking balance is $1250.00"
    tags: [smoke, banking, read]

  - id: wire-cutoff
    input: "what is the wire transfer cutoff"
    expected_output: "3:00 pm et"
    tags: [banking, policy]

  - id: ach-limit
    input: "what is the daily ach limit"
    expected_output: "$25000"
    tags: [banking, limits]

  - id: dispute-guidance
    input: "how do i dispute a charge"
    expected_output: "file a dispute within 60 days of the statement date"
    tags: [banking, disputes]

  - id: out-of-domain
    input: "what is the weather today"
    expected_output: "I don't know"        # refusal for non-banking input
    tags: [banking, negative, edge]
