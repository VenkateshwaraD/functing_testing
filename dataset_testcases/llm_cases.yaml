# Cases for the offline LLM example suite.
cases:
  - id: greeting
    input: "say hello"
    expected_output: "hello"
    tags: [smoke, llm]

  - id: arithmetic
    input: "what is 2+2"
    expected_output: "4"
    tags: [smoke, llm]

  - id: capital
    input: "capital of france"
    expected_output: "Paris"
    tags: [llm, facts]
