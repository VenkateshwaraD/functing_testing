# Memory cases — banking facts remembered across turns/sessions.
# apps.memory_app pre-seeds sess-seeded with account=chk-8841,
# beneficiary=landlord llc, currency=usd. Every case carries metadata for
# at least two of context_retention/forgetting_check/contradiction_resolution.
conversations:
  - id: account-remember
    session_id: sess-bank-1
    turns:
      - input: "my account number is 4521"
      - input: "what is my account number"
    metadata:
      must_remember: ["4521"]
      memory_key: "account"
      memory_value: "4521"
    tags: [memory, banking, conversation]

  - id: beneficiary-remember
    session_id: sess-bank-2
    turns:
      - input: "my beneficiary is landlord llc"
      - input: "who is my beneficiary"
    metadata:
      must_remember: ["landlord llc"]
      memory_key: "beneficiary"
      memory_value: "landlord llc"
    tags: [memory, banking, conversation]

cases:
  - id: account-recall
    input: "what is my account number"
    metadata:
      session_id: sess-seeded
      must_remember: ["chk-8841"]
      memory_key: "account"
      memory_value: "chk-8841"
    tags: [memory, banking]

  - id: currency-moved
    input: "what is my preferred currency"
    metadata:
      session_id: sess-seeded
      superseded: "eur"
      current: "usd"
      memory_key: "currency"
      memory_value: "usd"
    tags: [memory, banking, contradiction]

  - id: beneficiary-recall
    input: "who is my beneficiary"
    metadata:
      session_id: sess-seeded
      must_remember: ["landlord llc"]
      memory_key: "beneficiary"
      memory_value: "landlord llc"
    tags: [memory, banking]
