# Memory cases — banking facts remembered across turns/sessions.
# apps.memory_app pre-seeds sess-seeded with account=chk-8841, currency=usd.
conversations:
  - id: account-remember
    session_id: sess-bank-1
    turns:
      - input: "my account number is 4521"
      - input: "what is my account number"
    metadata:
      must_remember: ["4521"]
    tags: [memory, banking, conversation]

  - id: beneficiary-remember
    session_id: sess-bank-2
    turns:
      - input: "my beneficiary is landlord llc"
      - input: "who is my beneficiary"
    metadata:
      must_remember: ["landlord llc"]
    tags: [memory, banking, conversation]

cases:
  - id: account-recall
    input: "what is my account number"
    metadata:
      session_id: sess-seeded
      must_remember: ["chk-8841"]
      memory_key: "account"
    tags: [memory, banking]

  - id: currency-moved
    input: "what is my preferred currency"
    metadata:
      session_id: sess-seeded
      superseded: "eur"
      current: "usd"
    tags: [memory, banking, contradiction]
