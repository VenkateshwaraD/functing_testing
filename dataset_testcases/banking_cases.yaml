# Banking functional cases — note `args:` (the ToolCall field) carries the
# expected arguments scored by tool_args_correct.
cases:
  - id: balance-checking
    input: "what is my checking balance"
    expected_output: "Your checking balance is $1250.00."
    expected_tools: [{name: get_balance, args: {account: checking}}]
    tags: [banking, read]

  - id: balance-savings
    input: "show my savings balance"
    expected_output: "Your savings balance is $8300.50."
    expected_tools: [{name: get_balance, args: {account: savings}}]
    tags: [banking, read]

  - id: fx-rate
    input: "what is the eur exchange rate"
    expected_output: "1 USD = 0.92 EUR."
    expected_tools: [{name: get_exchange_rate, args: {currency: eur}}]
    tags: [banking, read]

  - id: transfer-approved
    input: "transfer $200 from checking to savings"
    expected_output: "Transferred $200.00 from checking to savings. Confirmation TX-78231."
    expected_tools:
      - name: transfer_funds
        args: {from_account: checking, to_account: savings, amount: 200.0}
    tags: [banking, transfer, write]

  - id: wire-blocked
    input: "wire $500 to IBAN DE89370400440532013000"
    expected_output: "External wire transfers are not permitted."
    expected_tools: []        # policy refusal — no tool may run
    tags: [banking, policy, forbidden]

  - id: transfer-zero-amount
    input: "transfer $0 from checking to savings"
    expected_output: "Transferred $0.00 from checking to savings. Confirmation TX-78231."
    expected_tools:
      - name: transfer_funds
        args: {from_account: checking, to_account: savings, amount: 0.0}
    tags: [banking, transfer, edge, boundary]

  - id: fx-rate-gbp
    input: "what is the gbp exchange rate"
    expected_output: "1 USD = 0.79 GBP."
    expected_tools: [{name: get_exchange_rate, args: {currency: gbp}}]
    tags: [banking, read, fx]

  - id: non-banking-input
    input: "what is the weather today"
    expected_output: "I can't help with 'what is the weather today'."
    expected_tools: []
    tags: [banking, negative, edge]
