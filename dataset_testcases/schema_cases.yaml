# Schema-testing cases — json_schema validates the response payload,
# data_quality validates row data carried in case metadata. Detection
# cases use `expect: fail` (strict xfail): the metric must score low —
# if it unexpectedly passes, the case fails.
cases:
  # --- json_schema: payment-status payload -----------------------------
  - id: payment-status-json
    input: "payment status json"        # target emits payment JSON → passes
    tags: [schema, banking, json]
    assert:
      - name: json_schema
        schema:
          type: object
          required: [status, amount, currency, endToEndId]
          properties:
            status: {type: string, enum: [approved, pending, denied]}
            amount: {type: number, exclusiveMinimum: 0}
            currency: {type: string, enum: [USD, EUR, GBP]}
            endToEndId: {type: string, pattern: "^E2E-"}
            iban: {type: string, pattern: "^[A-Z]{2}[0-9]{2}"}
          additionalProperties: false

  - id: freeform-response               # target emits prose → json_schema
    input: "payment status"             #   must score 0.0 — xfail confirms
    expect: fail                        #   the detection fired
    tags: [schema, banking, detection]
    assert:
      - name: json_schema
        schema:
          type: object
          required: [status, amount]

  # --- data_quality: transaction export rows ---------------------------
  - id: transactions-clean
    input: "export check"
    tags: [schema, banking, data-quality]
    metadata:
      rows:
        - {txn_id: "TX-78231", iban: "DE89370400440532013000",
           amount: 200.00, currency: USD, status: posted}
        - {txn_id: "TX-78232", iban: "GB29NWBK60161331926819",
           amount: 0.00, currency: GBP, status: pending}   # boundary: zero
      expectations:
        - {type: not_null, column: iban}
        - {type: unique, column: txn_id}
        - {type: matches_regex, column: iban, pattern: "[A-Z]{2}[0-9]{2}[A-Z0-9]+"}
        - {type: in_range, column: amount, min: 0}
        - {type: in_set, column: status, values: [posted, pending, failed]}
        - {type: row_count, min: 1}

  - id: transactions-dirty              # every expectation fails → 0.0 →
    input: "export check"               #   xfail confirms detection fired
    expect: fail
    tags: [schema, banking, data-quality, detection]
    assert:
      - name: data_quality
    metadata:
      rows:
        - {txn_id: "TX-78231", iban: "DE89370400440532013000",
           amount: -50.00, currency: USD, status: posted,
           card: "4111111111111111"}                     # PII + negative
        - {txn_id: "TX-78231", iban: null,
           amount: 75.00, currency: XXX, status: weird}  # dup id, null, bad
      expectations:
        - {type: not_null, column: iban}
        - {type: unique, column: txn_id}
        - {type: in_range, column: amount, min: 0}
        - {type: in_set, column: currency, values: [USD, EUR, GBP]}
        - {type: in_set, column: status, values: [posted, pending, failed]}
        - {type: no_pii, column: card}
