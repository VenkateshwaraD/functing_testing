# MCP cases — the suite's args_template maps {input} into the tool's
# `query` arg, so expected_tools pins both the call and its arguments.
# Per-case `assert` adds a content check — a semantically wrong reply
# (e.g. transactions for a fee question) now fails.
cases:
  - id: transaction-search
    input: "october transaction history"
    expected_tools: [{name: banking_search, args: {query: "october transaction history"}}]
    tags: [mcp, banking, tools]
    assert:
      - {name: contains, substrings: ["TX-78231"]}
      - name: tool_sequence
      - name: tool_args_correct
      - name: forbidden_tools
      - name: termination_check

  - id: fee-schedule
    input: "overdraft fee schedule"
    expected_tools: [{name: banking_search, args: {query: "overdraft fee schedule"}}]
    tags: [mcp, banking, tools]
    assert:
      - {name: contains, substrings: ["$35", "wire $25"]}
      - {name: not_contains, substrings: ["TX-78231"]}
      - name: tool_sequence
      - name: tool_args_correct
      - name: forbidden_tools
      - name: termination_check
