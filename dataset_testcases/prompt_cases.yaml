# Prompt-testing cases — positive path: templates resolve, no banned
# phrases, under token budget. Paired with prompt_testing_suite.yaml.
# prompt_echo returns "echo <input>" — expected_output must match exactly.
cases:
  - id: balance-query
    input: "check my checking balance"
    expected_output: "echo check my checking balance"
    tags: [prompt, smoke, banking]

  - id: transfer-inquiry
    input: "transfer $500 to savings"
    expected_output: "echo transfer $500 to savings"
    tags: [prompt, banking, transfer]

  - id: with-metadata
    input: "explain overdraft fees"
    metadata: {tone_rule: "Be formal."}          # fills {tone_rule} slot
    tags: [prompt, template, banking]
