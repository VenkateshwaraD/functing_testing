# Resilience cases — the injected transfer_funds fault must produce a
# graceful degradation message, not a crash or a fabricated confirmation.
cases:
  - id: transfer-degraded
    input: "transfer $200 from checking to savings"
    expected_output: "The payment service is unavailable — please retry shortly."
    tags: [banking, transfer, resilience]

  - id: balance-unaffected
    input: "what is my checking balance"
    expected_output: "Your checking balance is $1250.00."
    expected_tools: [{name: get_balance, args: {account: checking}}]
    tags: [banking, read, resilience]
