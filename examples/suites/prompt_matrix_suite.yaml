# Prompt matrix — every case runs once per prompt variant (offline).
name: prompt-matrix-demo

target:
  type: python
  function: "dummy.demo_app:prompt_echo"

datasets:
  - ../datasets/llm_cases.yaml

prompts:
  - name: terse
    template: "Answer in one word: {input}"
  - name: verbose
    template: "You are a thorough assistant. Explain: {input}"

metrics:
  - name: contains
    substrings: ["echo"]
  - name: prompt_sim
    template: "Answer in one word: {input}"
    banned: ["ignore previous", "jailbreak"]
    max_tokens: 500

gates:
  min_pass_rate: 1.0
