# Offline LLM suite — no API keys needed (python target + fake judge).
name: llm-demo

target:
  type: python
  function: "demo_app:answer"

datasets:
  - ../datasets/llm_cases.yaml

metrics:
  - name: exact_match
  - name: contains
    substrings: ["!"]
    threshold: 0.0  # informational — shows per-case metric detail

gates:
  min_pass_rate: 0.66
