# RAG suite — retrieval + generation + ingestion metrics, offline.
# demo_app:rag returns canned retrieval_context so everything replays.
name: rag-demo

target:
  type: python
  function: "demo_app:rag"

datasets:
  - ../datasets/rag_cases.yaml

embedder:
  provider: fake

metrics:
  - name: recall_at_k
    k: 2
  - name: hit_rate
    k: 2
  - name: context_window
    max_tokens: 8000
  - name: ingestion_parse
  - name: ingestion_dedup

gates:
  min_pass_rate: 0.8
