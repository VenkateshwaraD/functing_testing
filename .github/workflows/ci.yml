name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Ruff
        run: uv run ruff check src tests examples

      - name: Mypy
        run: uv run mypy

      # Replay-only: fake providers + cassettes, zero secrets needed.
      # Works on forks — no repository secrets are required.
      - name: Tests (replay-only)
        run: uv run pytest tests/ --cov=aitestkit --cov-report=xml -m "not live"
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""

      - name: Example suites (offline)
        working-directory: examples
        run: |
          export PYTHONPATH=.
          for suite in suites/*.yaml; do
            uv run aitestkit run "$suite" -o /tmp/example-out || exit $?
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python }}
          path: |
            coverage.xml
            /tmp/example-out/
          if-no-files-found: ignore
