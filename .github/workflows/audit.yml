name: audit

on:
  push:
    branches: [main]
    paths: ["uv.lock", "pyproject.toml"]
  schedule:
    - cron: "42 6 * * 1"   # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync deps
        run: uv sync --frozen

      - name: Audit dependencies
        run: uvx pip-audit --strict
