version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # uv.lock is regenerated by `uv lock --upgrade` — dependabot's
  # "uv" ecosystem tracks pyproject version bounds.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-deps:
        patterns: ["pytest*", "mypy*", "ruff*", "coverage*", "respx*"]
