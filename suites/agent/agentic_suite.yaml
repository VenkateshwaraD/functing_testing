# Agentic suite — trajectory metrics over a demo ReAct agent (offline).
name: payments-agentic

judge: {provider: openai, model: GPT-4}
version_tags: {model: "GPT-6 Luna"}

target:
  type: python
  function: "apps.agent_app:run"

datasets:
  - ../../dataset_testcases/agentic_cases.yaml

# judge: unset on purpose — resolves AITESTKIT_JUDGE_PROVIDER /
# AITESTKIT_JUDGE_MODEL > shipped defaults (openai/gpt-4o-mini).
# Export AITESTKIT_JUDGE_PROVIDER=fake for fully-offline runs.

metrics:
  - name: tool_sequence       # reads case.expected_tools — no params
  - name: forbidden_tools
    tools: ["delete", "drop"]
  - name: loop_detection
    max_repeats: 3
  - name: termination_check
  - name: task_completion
    threshold: 0.0   # informational — with fake judge always passes

gates:
  min_pass_rate: 0.8
