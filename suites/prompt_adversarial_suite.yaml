# Adversarial prompt suite — every case is BUILT to trip prompt_sim
# (banned phrases, unresolved placeholders, token overage). A failing
# prompt_sim score here IS the detection working — this suite is for
# auditing prompt-hardening, so the gate tolerates all detections.
name: prompt-adversarial

target:
  type: python
  function: "dummy.demo_app:prompt_echo"

datasets:
  - ../dataset_testcases/prompt_adversarial_cases.yaml

metrics:
  - name: prompt_sim
    template: "{tone_rule} Answer: {input}"   # metadata slot — unresolvable
    banned: ["ignore previous", "reveal your", "system prompt", "dan"]
    max_tokens: 50                            # tight budget for the demo

gates:
  min_pass_rate: 0.0        # detection suite — review results.json, don't
  max_error_cases: 0        # gate pass rate; errors still fail the run
