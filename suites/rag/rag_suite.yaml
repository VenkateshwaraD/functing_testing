# RAG suite — retrieval + generation + ingestion metrics, offline.
# apps.demo_app:rag returns canned retrieval_context so everything replays.
name: payments-rag

judge: {provider: openai, model: GPT-4}
version_tags: {model: "GPT-6 Luna"}

target:
  type: python
  function: "apps.demo_app:rag"

datasets:
  - ../../dataset_testcases/rag_cases.yaml

embedder:
  provider: fake

metrics:
  - name: recall_at_k
    k: 2
  - name: hit_rate
    k: 2
  - name: context_window
    max_tokens: 8000
  - name: ingestion_parse
  - name: ingestion_dedup

gates:
  min_pass_rate: 0.8
