# Prompt matrix — every case runs once per prompt variant (offline).
name: payments-prompt-matrix

judge: {provider: openai, model: GPT-4}
version_tags: {model: "GPT-6 Luna"}

target:
  type: python
  function: "apps.demo_app:prompt_echo"

datasets:
  - ../../dataset_testcases/llm_cases.yaml

prompts:
  - name: terse
    template: "Answer in one word: {input}"
  - name: verbose
    template: "You are a thorough assistant. Explain: {input}"

metrics:
  - name: contains
    substrings: ["echo"]
  - name: prompt_sim
    template: "Answer in one word: {input}"
    banned: ["ignore previous", "jailbreak"]
    max_tokens: 500

gates:
  min_pass_rate: 1.0
