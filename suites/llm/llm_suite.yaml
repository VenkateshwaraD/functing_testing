# Offline LLM suite — no API keys needed (python target + fake judge).
name: payments-llm

judge: {provider: openai, model: GPT-4}
version_tags: {model: "GPT-6 Luna"}

target:
  type: python
  function: "apps.demo_app:answer"

datasets:
  - ../../dataset_testcases/llm_cases.yaml

metrics:
  - name: exact_match
  - name: not_contains              # responses must not leak failure markers
    substrings: ["internal error", "unavailable", "traceback"]

gates:
  min_pass_rate: 0.66
  max_error_cases: 0
  max_flaky: 0.0
  max_skip_rate: 0.0
