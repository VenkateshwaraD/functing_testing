# Determinism demo — stochastic SUT + repeat: 5 -> flaky detection.
name: payments-flaky

judge: {provider: openai, model: GPT-4}
version_tags: {model: "GPT-6 Luna"}

target:
  type: python
  function: "apps.demo_app:flaky_answer"

datasets:
  - ../../dataset_testcases/llm_cases.yaml

repeat: 5

metrics:
  - name: exact_match

gates:
  max_flaky: 1.0       # detection suite — all cases may surface flaky;
                       # an explicit tolerance, not a vacuous 0-judged pass
  max_error_cases: 0
  max_skip_rate: 0.0
